<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wikipedia Graph Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="graphCanvas"></canvas>
  <canvas id="labelCanvas"></canvas>

  <div id="uiOverlay">
    <!-- Barra Superior: Busca e Ações -->
    <header id="topBar">
      <div id="searchContainer">
        <input id="searchInput" type="text" placeholder="🔍 Buscar artigo (ex: Brasil, Física, História)..." autocomplete="off">
        <div id="searchResults" class="hidden"></div>
      </div>
      <div id="quickActions">
        <button id="btnRandom" title="Saltar para artigo aleatório">🎲 Aleatório</button>
        <button id="btnPath" title="Menor caminho entre dois artigos">🧭 Caminho</button>
        <button id="btnReset" title="Centralizar e ajustar vista">⟲ Ajustar Vista</button>
      </div>
    </header>

    <!-- Barra Lateral Esquerda -->
    <aside id="leftSidebar">
      <!-- Painel de Estatísticas -->
      <section id="statsPanel" class="card">
        <h2>Wikipedia Graph Engine</h2>
        <div class="statsGrid">
          <div><label>Nós</label><span id="nodeCount">0</span></div>
          <div><label>Arestas</label><span id="edgeCount">0</span></div>
          <div><label>Comunidades</label><span id="commCount">0</span></div>
        </div>
        <p id="status">Carregando binários...</p>
        <p class="hint">Arraste · scroll zoom · duplo clique aproxima · <kbd>/</kbd> busca · <kbd>Esc</kbd> limpa</p>
      </section>

      <!-- Painel de Controles de Visualização -->
      <section id="controlsPanel" class="card">
        <h3>Ajustes de Visualização</h3>
        <div class="controlRow">
          <label>Espalhamento: <b id="valSpread">1.0x</b></label>
          <input id="sliderSpread" type="range" min="1" max="4" value="1" step="0.1">
        </div>
        <div class="controlRow">
          <label>Gravidade interna: <b id="valGrav">0%</b></label>
          <input id="sliderGrav" type="range" min="0" max="0.85" value="0" step="0.05">
        </div>
        <div class="controlRow" title="Desenha só os N artigos de maior grau (e as arestas entre eles). Menor = mais leve.">
          <label>Máx. nós (top N por grau): <b id="valTopN">200.000</b></label>
          <input id="sliderTopN" type="range" min="0" max="1000" value="650" step="1">
        </div>
        <div class="controlRow">
          <label>Grau Mínimo: <b id="valDeg">0</b></label>
          <input id="sliderDeg" type="range" min="0" max="100" value="0" step="1">
        </div>
        <div class="controlRow">
          <label>Tamanho Nós: <b id="valSize">1.0x</b></label>
          <input id="sliderSize" type="range" min="0.4" max="2.5" value="1.0" step="0.1">
        </div>
        <div class="controlRow">
          <label>Opacidade Arestas: <b id="valEdge">0.070</b></label>
          <input id="sliderEdge" type="range" min="0.01" max="0.30" value="0.07" step="0.005">
        </div>
        <div class="controlRow checks">
          <label><input id="chkEdges" type="checkbox" checked> Arestas</label>
          <label><input id="chkLabels" type="checkbox" checked> Rótulos</label>
        </div>
      </section>

      <!-- Painel de Comunidades -->
      <section id="commPanel" class="card">
        <div class="cardHeader">
          <h3>Comunidades</h3>
          <button id="clearFilter">Todas</button>
        </div>
        <div id="commList"></div>
      </section>
    </aside>

    <!-- Barra Lateral Direita -->
    <aside id="rightSidebar">
      <!-- Menor caminho entre dois artigos -->
      <section id="pathPanel" class="card hidden">
        <div class="cardHeader">
          <h3>Menor caminho</h3>
          <button id="closePath" title="Fechar">✕</button>
        </div>
        <label class="fieldLabel">Origem</label>
        <input id="pathFrom" class="textField" type="text" placeholder="Artigo de origem" autocomplete="off">
        <div id="pathFromResults" class="inlineResults hidden"></div>
        <label class="fieldLabel">Destino</label>
        <input id="pathTo" class="textField" type="text" placeholder="Artigo de destino" autocomplete="off">
        <div id="pathToResults" class="inlineResults hidden"></div>
        <div class="controlRow">
          <label class="fieldLabel">Sentido dos links</label>
          <select id="pathDir" class="textField">
            <option value="dir">Seguir os links (origem → destino)</option>
            <option value="und">Ignorar o sentido</option>
          </select>
        </div>
        <label class="checkLine" title="Esconde o resto do grafo enquanto o caminho está na tela (bem mais leve com zoom afastado)">
          <input id="chkPathOnly" type="checkbox" checked> Mostrar só o caminho
        </label>
        <div class="rowButtons">
          <button id="pathGo">Buscar caminho</button>
          <button id="pathSwap" title="Trocar origem e destino">⇄</button>
          <button id="pathClear">Limpar</button>
        </div>
        <div id="pathResult"></div>
      </section>

      <!-- Painel de Detalhes do Nó -->
      <section id="infoPanel" class="card hidden">
        <div class="cardHeader">
          <h3 id="infoTitle"></h3>
          <button id="clearSel" title="Fechar">✕</button>
        </div>
        <div class="infoBadges">
          <span class="badge" id="infoDeg"></span>
          <span class="badge" id="infoComm"></span>
        </div>
        <a id="wikiLink" href="#" target="_blank" rel="noopener">Abrir artigo na Wikipédia ↗</a>
        <div class="rowButtons">
          <button id="setFrom">Usar como origem</button>
          <button id="setTo">Usar como destino</button>
        </div>

        <div id="hoodControls">
          <h4>Vizinhança</h4>
          <div class="controlRow">
            <label>Profundidade: <b id="valDepth">1</b></label>
            <input id="sliderDepth" type="range" min="1" max="5" value="1" step="1">
          </div>
          <div class="controlRow">
            <label>Links a seguir</label>
            <select id="hoodDir" class="textField">
              <option value="both">Que saem e que entram</option>
              <option value="out">Só os que saem</option>
              <option value="in">Só os que entram</option>
            </select>
          </div>
          <div class="controlRow">
            <label>Máx. nós desenhados: <b id="valMaxShown">2000</b></label>
            <input id="sliderMaxShown" type="range" min="100" max="20000" value="2000" step="100">
          </div>
          <div id="levelList"></div>
          <button id="fitHood">Enquadrar vizinhança</button>
        </div>

        <div id="neighborsSection">
          <h4>Conexões diretas (<span id="infoNeighbors"></span>):</h4>
          <div id="neighborsList"></div>
        </div>
      </section>
    </aside>

    <!-- Tooltip Flutuante -->
    <div id="tooltip" class="hidden"></div>
  </div>

  <script src="graph.js"></script>
  <script src="app.js"></script>
</body>
</html>
